name: irc-platform
kind: platform
version: 1.0.0
description: >
  IRC gateway adapter for Gengar.
  Connects to an IRC server and relays messages between an IRC channel
  (or DMs) and the Gengar agent.  No external dependencies — uses
  Python's stdlib asyncio for the IRC protocol.
author: James Fincher
requires_env:
  - IRC_SERVER
  - IRC_CHANNEL
  - IRC_NICKNAME
