name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Gengar — traces conversations, LLM calls, and tool usage. Opt-in via `gengar plugins enable observability/langfuse` or `gengar tools → Langfuse Observability`."
author: jamesfincher
requires_env:
  - GENGAR_LANGFUSE_PUBLIC_KEY
  - GENGAR_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
